[package]
name = "goodbyedpi-toggle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "GoodbyeDPI on/off system tray toggle for Windows"
license = "MIT"
repository = "https://github.com/icetea-risu/goodbyedpi-toggle"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
